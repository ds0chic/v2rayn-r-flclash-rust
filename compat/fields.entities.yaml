  target: ProfileItem.Remarks
  resolution_time: 生成配置时对属于该订阅的节点，构造虚拟 ProxyChain
  resolver_symbol: AppManager.GetProfileItemViaRemarks
  resolution_expr: BuildSubscriptionChainNodeAsync：prevNode=GetProfileItemViaRemarks(SubItem.PrevProfile)，nextNode=...NextProfile；ChildItems=[prev?.IndexId, node.IndexId, next?.IndexId]
