[package]
name = "upgrade_runner"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "External self-update helper: wait for the app to exit, swap versions atomically, restart."

[[bin]]
name = "upgrade_runner"
path = "src/main.rs"

[dependencies]
updater.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[dev-dependencies]
application.workspace = true
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
tiny_http = "0.12"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
tempfile = "3.27.0"
sha2 = "0.10.9"
hex = "0.4.3"

[lints]
workspace = true
