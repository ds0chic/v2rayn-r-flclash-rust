    upstream_source: v2rayN/ServiceLib/Models/Entities/ProfileItem.cs
    fields:
      stream_security:       { fld: FLD-ENT-018, upstream_key: StreamSecurity,       type: "string?" }
      allow_insecure:        { fld: FLD-ENT-019, upstream_key: AllowInsecure,        type: "string?" }
      sni:                   { fld: FLD-ENT-020, upstream_key: Sni,                  type: "string?" }
      alpn:                  { fld: FLD-ENT-021, upstream_key: Alpn,                 type: "string?" }
      fingerprint:           { fld: FLD-ENT-022, upstream_key: Fingerprint,          type: "string?" }
      public_key:            { fld: FLD-ENT-023, upstream_key: PublicKey,            type: "string?" }
      short_id:              { fld: FLD-ENT-024, upstream_key: ShortId,              type: "string?" }
