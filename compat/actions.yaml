hotkey_scope_rules:
- id: HKR-001
  name: 节点表键盘作用域（WPF ProfilesView）
  description: lstProfiles.PreviewKeyDown 同时处理 Ctrl 与无修饰键两类；Ctrl+A/C/D/F/O/R/T/E 与 Enter/Delete/Back/T/U/D/B/Esc 生效；ProxiesView 与 RoutingRuleSetting/AddGroupServer 另有独立作用域。
  source_file: v2rayN/v2rayN/Views/ProfilesView.xaml.cs
  evidence:
  - v2rayN/v2rayN/Views/ProfilesView.xaml.cs:220
  - v2rayN/v2rayN/Views/ProfilesView.xaml.cs:222
  - v2rayN/v2rayN/Views/ProfilesView.xaml.cs:260
- id: HKR-002
  name: 主窗口输入框聚焦时 Ctrl+V 短路
  description: MainWindow.PreviewKeyDown 中 Ctrl+V 在 Keyboard.FocusedElement 为 TextBox 时 return，不触发剪切板导入；Ctrl+S/F5 不受此限制。
  source_file: v2rayN/v2rayN/Views/MainWindow.xaml.cs
  evidence:
  - v2rayN/v2rayN/Views/MainWindow.xaml.cs:217
  - v2rayN/v2rayN/Views/MainWindow.xaml.cs:218
- id: HKR-003
  name: 节点表默认按键被禁用
  description: ProfilesView.xaml 的 DataGrid.InputBindings 将 Ctrl+C/Ctrl+V/Delete/Enter 绑定为 NotACommand，阻止 DataGrid 默认复制/粘贴/删除/提交行为，改由代码后置处理。
  source_file: v2rayN/v2rayN/Views/ProfilesView.xaml
  evidence:
  - v2rayN/v2rayN/Views/ProfilesView.xaml:115
  - v2rayN/v2rayN/Views/ProfilesView.xaml:116
  - v2rayN/v2rayN/Views/ProfilesView.xaml:118
  - v2rayN/v2rayN/Views/ProfilesView.xaml:119
- id: HKR-004
  name: 路由规则窗口按键作用域限制
  description: RoutingRuleSettingWindow.PreviewKeyDown 仅在 lstRules.IsKeyboardFocusWithin 为真时生效；Ctrl+A/C 与 T/U/D/B/Delete/Back；点击表头/表单区不触发。
  source_file: v2rayN/v2rayN/Views/RoutingRuleSettingWindow.xaml.cs
  evidence:
  - v2rayN/v2rayN/Views/RoutingRuleSettingWindow.xaml.cs:87
  - v2rayN/v2rayN/Views/RoutingRuleSettingWindow.xaml.cs:89
- id: HKR-005
  name: 策略组子节点表按键作用域限制
  description: AddGroupServerWindow.PreviewKeyDown 仅在 lstChild.IsKeyboardFocusWithin 为真时生效；Ctrl+A 与 T/U/D/B/Delete/Back。
  source_file: v2rayN/v2rayN/Views/AddGroupServerWindow.xaml.cs
  evidence:
  - v2rayN/v2rayN/Views/AddGroupServerWindow.xaml.cs:81
  - v2rayN/v2rayN/Views/AddGroupServerWindow.xaml.cs:83
- id: HKR-006
  name: 过滤器输入框回车刷新
  description: ProfilesView/ProfilesSelectWindow 的 txtServerFilter PreviewKeyDown 中 Enter 触发 RefreshServers。
  source_file: v2rayN/v2rayN/Views/ProfilesView.xaml.cs
  evidence:
  - v2rayN/v2rayN/Views/ProfilesView.xaml.cs:316
  - v2rayN/v2rayN/Views/ProfilesSelectWindow.xaml.cs:144
- id: HKR-007
  name: 全局热键录制期间暂停注册
  description: GlobalHotkeySettingWindow 打开时 HotkeyManager.Instance.IsPause=true，关闭时置 false；暂停期间按键被转发为普通 KeyDown。
  source_file: v2rayN/v2rayN/Views/GlobalHotkeySettingWindow.xaml.cs
  evidence:
  - v2rayN/v2rayN/Views/GlobalHotkeySettingWindow.xaml.cs:16
  - v2rayN/v2rayN/Views/GlobalHotkeySettingWindow.xaml.cs:17
- id: HKR-008
  name: Avalonia 平台的 Ctrl/Meta 等价
  description: Avalonia 视图用 e.KeyModifiers is KeyModifiers.Control or KeyModifiers.Meta，在 macOS 上 Cmd 与 Ctrl 等效。
  source_file: v2rayN/v2rayN.Desktop/Views/ProfilesView.axaml.cs
  evidence:
  - v2rayN/v2rayN.Desktop/Views/ProfilesView.axaml.cs:243
  - v2rayN/v2rayN.Desktop/Views/MainWindow.axaml.cs:218
scheduled_tasks:
- id: SCH-001
  name: 订阅自动更新定时任务
  action_id: ACT-SUB-006
  trigger: PeriodicTimer 每分钟一次
  interval_source: SubItem.AutoUpdateInterval（分钟，>0 才参与）；上次更新时间 SubItem.UpdateTime
  behavior: 对 AutoUpdateInterval>0 且 updateTime-UpdateTime>=AutoUpdateInterval*60 的订阅逐个调用 SubscriptionHandler.UpdateProcess（强制走代理 blProxy=true），更新后回写 UpdateTime 并 AddSubItem，每条间隔 1 秒
  cancellable: false
  source_file: v2rayN/ServiceLib/Manager/TaskManager.cs
  evidence:
  - v2rayN/ServiceLib/Manager/TaskManager.cs:22
  - v2rayN/ServiceLib/Manager/TaskManager.cs:29
  - v2rayN/ServiceLib/Manager/TaskManager.cs:87
  - v2rayN/ServiceLib/Manager/TaskManager.cs:104
  status: identified
- id: SCH-002
  name: 配置与统计定时保存
  action_id: null
  trigger: PeriodicTimer 每 20 次 tick（约 20 分钟）
  interval_source: 硬编码 20
  behavior: ConfigHandler.SaveConfig + ProfileExManager.SaveTo
  cancellable: false
  source_file: v2rayN/ServiceLib/Manager/TaskManager.cs
  evidence:
  - v2rayN/ServiceLib/Manager/TaskManager.cs:37
  - v2rayN/ServiceLib/Manager/TaskManager.cs:43
  status: identified
- id: SCH-003
  name: 过期文件清理与 Geo 更新
  action_id: null
  trigger: PeriodicTimer 每 60 次 tick（约 1 小时）
  interval_source: 硬编码 60；Geo 间隔来自 GuiItem.AutoUpdateInterval
  behavior: 删除 binConfig 下 Test* 中 1 小时前文件、日志目录与临时目录中 7 天前文件；当 GuiItem.AutoUpdateInterval>0 且 hours%interval==0 时 UpdateService.UpdateGeoFileAll
  cancellable: false
  source_file: v2rayN/ServiceLib/Manager/TaskManager.cs
  evidence:
  - v2rayN/ServiceLib/Manager/TaskManager.cs:53
  - v2rayN/ServiceLib/Manager/TaskManager.cs:57
  - v2rayN/ServiceLib/Manager/TaskManager.cs:58
  - v2rayN/ServiceLib/Manager/TaskManager.cs:59
  - v2rayN/ServiceLib/Manager/TaskManager.cs:118
  status: identified
- id: SCH-004
  name: 每日检查更新
  action_id: ACT-UPDATE-003
  trigger: PeriodicTimer numOfExecuted%1440==1（约每 24 小时）
  interval_source: 硬编码 1440
  behavior: UpdateService.CheckHasUpdateOnlyAll(CheckPreReleaseUpdate, UpdateViaProxy)，消息入通知队列；有更新时 Publish HasUpdateNotified(true)
  cancellable: false
  source_file: v2rayN/ServiceLib/Manager/TaskManager.cs
  evidence:
  - v2rayN/ServiceLib/Manager/TaskManager.cs:72
  - v2rayN/ServiceLib/Manager/TaskManager.cs:76
  - v2rayN/ServiceLib/Manager/TaskManager.cs:131
  status: identified
- id: SCH-005
  name: 消息视图刷新定时器
  action_id: ACT-MSG-001
  trigger: Signal.Every(1 秒)（视图激活期间）
  interval_source: 硬编码 1 秒；受 MsgViewModel.AutoRefresh 与 ShowInTaskbar 控制
  behavior: 将后台消息队列批量刷入消息视图，上限 NumMaxMsg=500
  cancellable: true
  cancel_behavior: 视图 dispose 时停止订阅
  source_file: v2rayN/ServiceLib/ViewModels/MsgViewModel.cs
  evidence:
  - v2rayN/ServiceLib/ViewModels/MsgViewModel.cs:36
  - v2rayN/ServiceLib/ViewModels/MsgViewModel.cs:9
  - v2rayN/ServiceLib/ViewModels/MsgViewModel.cs:44
  status: identified
- id: SCH-006
  name: Clash 代理列表刷新定时器
  action_id: null
  trigger: PeriodicTimer 1 秒
  interval_source: ClashUIItem.ProxiesRefreshInterval（秒，>0）
  behavior: 当 AutoRefresh && ShowInTaskbar && 运行 sing_box 时按间隔 GetClashProxies；取消时静默退出
  cancellable: true
  cancel_behavior: CancellationDisposable 随视图释放；捕获 OperationCanceledException
  source_file: v2rayN/ServiceLib/ViewModels/ClashProxiesViewModel.cs
  evidence:
  - v2rayN/ServiceLib/ViewModels/ClashProxiesViewModel.cs:111
  - v2rayN/ServiceLib/ViewModels/ClashProxiesViewModel.cs:121
  - v2rayN/ServiceLib/ViewModels/ClashProxiesViewModel.cs:126
  - v2rayN/ServiceLib/ViewModels/ClashProxiesViewModel.cs:133
  status: identified
- id: SCH-007
  name: Clash 连接列表刷新定时器
  action_id: null
  trigger: PeriodicTimer 1 秒
  interval_source: ClashUIItem.ConnectionsRefreshInterval（秒，>0）
  behavior: 当 AutoRefresh && ShowInTaskbar && 运行 sing_box 时按间隔 GetClashConnections
  cancellable: true
  cancel_behavior: CancellationDisposable 随视图释放；捕获 OperationCanceledException
  source_file: v2rayN/ServiceLib/ViewModels/ClashConnectionsViewModel.cs
  evidence:
  - v2rayN/ServiceLib/ViewModels/ClashConnectionsViewModel.cs:127
  - v2rayN/ServiceLib/ViewModels/ClashConnectionsViewModel.cs:137
  - v2rayN/ServiceLib/ViewModels/ClashConnectionsViewModel.cs:142
  - v2rayN/ServiceLib/ViewModels/ClashConnectionsViewModel.cs:149
  status: identified
