[package]
name = "application"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Minimal T01 use cases: synthetic node generation and ping."

[dependencies]
domain.workspace = true
ipc_contract.workspace = true
persistence.workspace = true
runtime.workspace = true
subscriptions.workspace = true
config_codegen.workspace = true
rusqlite = "0.32.1"
regex = "1"
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
tokio = { version = "1.53", features = ["rt", "time", "sync"] }

[dev-dependencies]
rustls-pemfile = "2"
rustls-native-certs = "0.8"
tempfile = "3.27.0"

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }

[lints]
workspace = true
