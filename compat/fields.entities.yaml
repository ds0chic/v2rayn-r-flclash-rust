migration_paths:
- id: MIG-ENT-001
  name: MigrateProfileExtra（编排入口）
  from_version: 2
  to_version: 4
  trigger: InitComponents 中 Task.Run(MigrateProfileExtra).Wait()
  symbol: AppManager.MigrateProfileExtra
  steps: 顺序调用 MigrateProfileExtraGroupV2ToV3 -> MigrateProfileExtraV2ToV3 -> MigrateProfileTransportV3ToV4
  idempotency: 各子步骤以 ConfigVersion 阈值过滤，完成后回写版本号，不会重复处理
  failure_handling: 子步骤内部逐条 try/catch 记录日志，失败项保持旧版本，下次启动重试
  evidence:
  - v2rayN/ServiceLib/Manager/AppManager.cs:107
  - v2rayN/ServiceLib/Manager/AppManager.cs:328
  - v2rayN/ServiceLib/Manager/AppManager.cs:330
  - v2rayN/ServiceLib/Manager/AppManager.cs:332
  - v2rayN/ServiceLib/Manager/AppManager.cs:334
  status: identified
- id: MIG-ENT-002
  name: MigrateProfileExtraGroupV2ToV3（组节点）
  from_version: 2
  to_version: 3
  identify: SELECT * FROM ProfileItem WHERE ConfigVersion < 3 AND ConfigType IN (101 PolicyGroup,102 ProxyChain)
  convert: 从 ProfileGroupItem 表按 IndexId 取组配置；写 ProtocolExtra：GroupType=ConfigType.ToString()，并复制 ChildItems/SubChildItems/Filter/MultipleLoad
  write_back: UpdateAllAsync(updateProfileItems)，item.ConfigVersion=3
  symbol: AppManager.MigrateProfileExtraGroupV2ToV3
  idempotency: ConfigVersion<3 过滤；ProfileGroupItem 不删除（ClearAll 被注释，行361/640）
  failure_handling: 单条 catch 记录 Logging.SaveLog；整批更新失败返回 false 并记录
  evidence:
  - v2rayN/ServiceLib/Manager/AppManager.cs:577
  - v2rayN/ServiceLib/Manager/AppManager.cs:580
  - v2rayN/ServiceLib/Manager/AppManager.cs:599
  - v2rayN/ServiceLib/Manager/AppManager.cs:603
  - v2rayN/ServiceLib/Manager/AppManager.cs:614
  - v2rayN/ServiceLib/Manager/AppManager.cs:627
  status: identified
- id: MIG-ENT-003
  name: MigrateProfileExtraV2ToV3（普通节点）
  from_version: 2
  to_version: 3
  identify: 分页 SELECT * FROM ProfileItem WHERE ConfigVersion < 3 AND ConfigType NOT IN (101,102) LIMIT 100 OFFSET n
  convert: 按 ConfigType 把旧列写入 ProtocolExtra：Shadowsocks Security->SsMethod；VMess AlterId/Security->AlterId/VmessSecurity；VLESS Flow/Security->Flow/VlessEncryption；Hysteria2 Path/Ports + 全局 HysteriaItem->SalamanderPass/Ports/UpMbps/DownMbps/HopInterval；TUIC HeaderType->CongestionControl 且 Username=Id, Id=Security, Password=Security；HTTP/SOCKS Username=Security；WireGuard PublicKey/RequestHost/Path/ShortId->WgPublicKey/WgInterfaceAddress/WgReserved/WgMtu(默认1280)。收尾统一 item.Password=item.Id
  write_back: UpdateAllAsync；item.ConfigVersion=3
  symbol: AppManager.MigrateProfileExtraV2ToV3 / MigrateProfileExtraV2ToV3Sub
  idempotency: ConfigVersion<3 过滤；offset 仅按失败条数推进（成功项因版本变更被排除）
  failure_handling: 单条 catch 记录 Logging.SaveLog；更新失败返回 0，offset 保持在失败项前
  evidence:
  - v2rayN/ServiceLib/Manager/AppManager.cs:344
  - v2rayN/ServiceLib/Manager/AppManager.cs:486
  - v2rayN/ServiceLib/Manager/AppManager.cs:489
  - v2rayN/ServiceLib/Manager/AppManager.cs:492
  - v2rayN/ServiceLib/Manager/AppManager.cs:500
  - v2rayN/ServiceLib/Manager/AppManager.cs:508
  - v2rayN/ServiceLib/Manager/AppManager.cs:519
  - v2rayN/ServiceLib/Manager/AppManager.cs:526
  - v2rayN/ServiceLib/Manager/AppManager.cs:531
  - v2rayN/ServiceLib/Manager/AppManager.cs:542
  - v2rayN/ServiceLib/Manager/AppManager.cs:544
  - v2rayN/ServiceLib/Manager/AppManager.cs:546
  - v2rayN/ServiceLib/Manager/AppManager.cs:358
  status: identified
- id: MIG-ENT-004
  name: MigrateProfileTransportV3ToV4（传输层）
  from_version: 3
  to_version: 4
  identify: 分页 SELECT * FROM ProfileItem WHERE ConfigVersion = 3 LIMIT 100 OFFSET n
  convert: Network==raw 别名改写为 raw；按 GetNetwork() 分支把旧列写 TransportExtra：raw->RawHeaderType/Host/Path；ws/httpupgrade->Host/Path；xhttp->Host/Path/XhttpMode=HeaderType/XhttpExtra=Extra；grpc->GrpcAuthority=RequestHost/GrpcServiceName=Path/GrpcMode=HeaderType；kcp->KcpHeaderType=HeaderType/KcpSeed=Path；default 归一到 DefaultNetwork 并写 RawHeaderType/Host
  write_back: SetTransportExtra；item.ConfigVersion=4；UpdateAllAsync
  symbol: AppManager.MigrateProfileTransportV3ToV4
  idempotency: ConfigVersion=3 过滤；更新后为 4 不再重入
  failure_handling: 单条 catch 记录；更新失败 offset += batch.Count 跳过整批
  evidence:
  - v2rayN/ServiceLib/Manager/AppManager.cs:371
  - v2rayN/ServiceLib/Manager/AppManager.cs:383
  - v2rayN/ServiceLib/Manager/AppManager.cs:392
  - v2rayN/ServiceLib/Manager/AppManager.cs:401
