reference_semantics:
- id: REF-ENT-001
  name: 路由规则 OutboundTag -> 节点 Remarks
  reference_type: string_remarks
  target: ProfileItem.Remarks
  resolution_time: 每次生成内核配置时（CoreConfigContextBuilder.Build）
  resolver_symbol: AppManager.GetProfileItemViaRemarks
  resolution_expr: List<RulesItem> rules = JsonUtils.Deserialize<List<RulesItem>>(RoutingItem.RuleSet)；对 Enabled 且 OutboundTag 非内置 tag 的规则按 Remarks 取节点
  dangling_behavior: OutboundTag 为空或节点不存在 -> 追加 Warning(MsgRoutingRuleEmptyOutboundTag / MsgRoutingRuleOutboundNodeNotFound)，回退为 Global.ProxyTag；校验失败的引用节点追加错误并回退 ProxyTag
