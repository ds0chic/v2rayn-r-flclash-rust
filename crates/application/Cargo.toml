[package]
name = "application"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Minimal T01 use cases: synthetic node generation and ping."

[dependencies]
domain.workspace = true
ipc_contract.workspace = true
persistence.workspace = true
runtime.workspace = true
subscriptions.workspace = true
config_codegen.workspace = true
platform.workspace = true
core_adapters.workspace = true
updater.workspace = true
rusqlite = "0.32.1"
regex = "1"
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-native-roots",
    "stream",
    "http2",
] }
tokio = { version = "1.53", features = ["rt", "time", "sync"] }

[dev-dependencies]
rustls-pemfile = "2"
rustls-native-certs = "0.8"
tempfile = "3.27.0"
tiny_http = "0.12"
sha2 = "0.10.9"
hex = "0.4.3"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }

[lints]
workspace = true
