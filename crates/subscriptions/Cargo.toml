[package]
name = "subscriptions"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Share-URI Fmt codecs, subscription parsing/merge and the download adapter (T09)."

[dependencies]
domain.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
regex = "1.13.1"
base64 = "0.22"
percent-encoding = "2.3"
encoding_rs = "0.8"
url = "2.5"
flate2 = "1.1"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-native-roots",
    "gzip",
    "brotli",
    "deflate",
    "stream",
    "http2",
    "charset",
] }
tokio = { version = "1.53", features = [
    "rt",
    "rt-multi-thread",
    "time",
    "sync",
    "macros",
    "net",
] }

[dev-dependencies]
tokio = { version = "1.53", features = ["full"] }
tempfile = "3.27.0"

[lints]
workspace = true
