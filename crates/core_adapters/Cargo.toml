[package]
name = "core_adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kernel observability adapters: Xray/sing-box statistics, Clash API client, log stream (T15)."

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror = "1"
tokio = { version = "1.53", features = [
    "rt",
    "rt-multi-thread",
    "time",
    "sync",
    "macros",
    "net",
    "io-util",
] }
reqwest = { version = "0.12", default-features = false }
tokio-tungstenite = "0.26"
futures-util = "0.3"
urlencoding = "2.1"
bytes = "1"

[dev-dependencies]
tokio = { version = "1.53", features = ["full"] }
tiny_http = "0.12"
tempfile = "3.27"
futures-util = "0.3"
tokio-tungstenite = "0.26"
serde_json.workspace = true

[lints]
workspace = true
