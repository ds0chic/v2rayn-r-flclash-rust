section: settings
storage_topology:
  guiNConfig.json:
    description: 整个 Config 对象由 ConfigHandler.LoadConfig/SaveConfig 序列化写入；JsonUtils 无命名策略，键名为 C# 属性名（PascalCase），SaveConfig 使用 Serialize(config, true, true) 即缩进且写出 null。
    root_type: ServiceLib.Models.Configs.Config
    tree:
    - IndexId
    - SubIndexId
    - CoreBasicItem
    - TunModeItem
    - KcpItem
    - GrpcItem
    - RoutingBasicItem
    - GuiItem
    - MsgUIItem
    - UiItem
    - ConstItem
    - SpeedTestItem
    - Mux4RayItem
    - Mux4SboxItem
    - HysteriaItem
    - ClashUIItem
    - SystemProxyItem
    - WebDavItem
    - CheckUpdateItem
    - Fragment4RayItem
    - Inbound[]
    - GlobalHotkeys[]
    - CoreTypeItem[]
    - SimpleDNSItem
    - HappyEyeballs4RayItem
  guiNDB.db:
    description: SQLite 数据库文件（SqliteHelper.cs 中 _configDB = guiNDB.db）；仅保存 ProfileItem/SubItem/RoutingItem/DNSItem 等实体，不保存本分册的 Config 设置字段。
    tables:
    - SubItem
    - ProfileItem
    - ServerStatItem
    - RoutingItem
    - ProfileExItem
    - DNSItem
    - FullConfigTemplateItem
    - ProfileGroupItem
  external_files:
  - Mixin.yaml：Clash Mizin 内容（Global.ClashMixinConfigFileName，CoreConfigClashService.cs:171），非设置字段本身
