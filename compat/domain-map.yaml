# domain-map.yaml - T02 Rust domain model <-> FLD-* <-> storage index
#
# Bidirectional index between the T02 Rust domain types/fields, the T00 field
# ledger ids (compat/fields.yaml), and the storage location in the frozen
# upstream (guiNConfig.json / guiNDB.db).
#
# This file is additive: it never deletes or rewrites fields.yaml entries.
# Field ids are taken verbatim from compat/fields.yaml (settings items
# FLD-CFG-001..180; entity items FLD-ENT-001..158).
#
# Casing: Rust fields are snake_case; upstream JSON/SQLite columns are
# PascalCase. `upstream_key` records the exact upstream casing so migration
# (T04) can map without guessing. `extra` stands for the unknown-extension
# `#[serde(flatten)] extra` bag on every domain struct.

schema_version: 1
source_commit: 7d6a967c18c697f28dc6917122ed3a4993fcf336
upstream_version: 7.25.4
task: T02
rust_crate: domain

# ---------------------------------------------------------------------------
# Enums (numeric values must match upstream exactly)
# ---------------------------------------------------------------------------
enums:
  - rust: domain::ConfigType
    ledger: FLD-ENT-002
    upstream_enum: v2rayN/ServiceLib/Enums/EConfigType.cs
    values:
      Vmess: 1
      Custom: 2
      Shadowsocks: 3
      Socks: 4
      Vless: 5
      Trojan: 6
      Hysteria2: 7
      Tuic: 8
      WireGuard: 9
      Http: 10
      Anytls: 11
      Naive: 12
      Outbound: 13
      PolicyGroup: 101
      ProxyChain: 102
  - rust: domain::CoreType
    ledger: FLD-ENT-003
    upstream_enum: v2rayN/ServiceLib/Enums/ECoreType.cs
    values:
      V2fly: 1
      Xray: 2
      V2flyV5: 4
      Mihomo: 13
      Hysteria: 21
      NaiveProxy: 22
      Tuic: 23
      SingBox: 24
      Juicity: 25
      Hysteria2: 26
      Brook: 27
      OverTls: 28
      ShadowQuic: 29
      Mieru: 30
      App: 99
    note: App=99 is the application-update identity, not a proxy core.
  - rust: domain::Network
    ledger: FLD-ENT-014
    upstream_enum: v2rayN/ServiceLib/Enums/ETransport.cs
    serialization: lowercase upstream name; h2/http normalize to raw at generation.
  - rust: domain::RuleType
    ledger: FLD-ENT-150
    values: { All: 0, Routing: 1, Dns: 2 }
  - rust: domain::MultipleLoad
    ledger: FLD-ENT-069
    values: [LeastPing, Fallback, Random, RoundRobin, LeastLoad]
  - rust: domain::SysProxyType
    ledger: FLD-CFG-137
    values: { ForcedClear: 0, ForcedChange: 1, Unchanged: 2, Pac: 3 }
  - rust: domain::GirdOrientation
    ledger: FLD-CFG-070
    values: [Horizontal, Vertical, Tab]
  - rust: domain::SpeedTestAction
    upstream_enum: v2rayN/ServiceLib/Enums/ESpeedActionType.cs
    values: [Tcping, Realping, UdpTest, Speedtest, Mixedtest, FastRealping]
  - rust: domain::RuleMode
    upstream_enum: v2rayN/ServiceLib/Enums/ERuleMode.cs
    values: { Rule: 0, Global: 1, Direct: 2 }
  - rust: domain::InboundProtocol
    upstream_enum: v2rayN/ServiceLib/Enums/EInboundProtocol.cs
    values: { Socks: 0, Socks2: 1, Socks3: 2, Pac: 3, Api: 4, Api2: 5, Mixed: 6, Speedtest: 21 }
    note: inbound local port = Inbound[0].LocalPort + protocol value.

# ---------------------------------------------------------------------------
# ProfileItem (40) + ProtocolExtraItem (30) + TransportExtraItem (11)
# storage: guiNDB.db table ProfileItem. ProtoExtra/TransportExtra are JSON
# text columns whose members are the nested ProtocolExtra/TransportExtra maps.
# ---------------------------------------------------------------------------
types:
  - rust: domain::Profile
    storage: { kind: guiNDB.db, table: ProfileItem, primary_key: IndexId }
    upstream_source: v2rayN/ServiceLib/Models/Entities/ProfileItem.cs
    fields:
      index_id:          { fld: FLD-ENT-001, upstream_key: IndexId,         type: string }
      config_type:       { fld: FLD-ENT-002, upstream_key: ConfigType,      type: "enum<ConfigType>" }
      core_type:         { fld: FLD-ENT-003, upstream_key: CoreType,        type: "enum<CoreType>?" }
      config_version:    { fld: FLD-ENT-004, upstream_key: ConfigVersion,   type: i32 }
      subid:             { fld: FLD-ENT-005, upstream_key: Subid,           type: string }
      is_sub:            { fld: FLD-ENT-006, upstream_key: IsSub,           type: bool }
      pre_socks_port:    { fld: FLD-ENT-007, upstream_key: PreSocksPort,    type: "i32?" }
      display_log:       { fld: FLD-ENT-008, upstream_key: DisplayLog,      type: bool }
      remarks:           { fld: FLD-ENT-009, upstream_key: Remarks,         type: string }
      address:           { fld: FLD-ENT-010, upstream_key: Address,         type: string }
      port:              { fld: FLD-ENT-011, upstream_key: Port,            type: i32 }
      password:          { fld: FLD-ENT-012, upstream_key: Password,        type: string }
      username:          { fld: FLD-ENT-013, upstream_key: Username,        type: string }
      network:           { fld: FLD-ENT-014, upstream_key: Network,         type: string }
      mux_enabled:       { fld: FLD-ENT-028, upstream_key: MuxEnabled,      type: "bool?" }
      finalmask:         { fld: FLD-ENT-033, upstream_key: Finalmask,       type: "string?" }
      # protocol/transport JSON blob columns
      proto_extra:       { fld: FLD-ENT-034, upstream_key: ProtoExtra,      type: "ProtocolExtra (JSON text)" }
      transport_extra:   { fld: FLD-ENT-035, upstream_key: TransportExtra,  type: "TransportExtra (JSON text)" }
      # legacy/obsolete columns preserved (HeaderType/RequestHost/Path/Extra/
      # Ports/AlterId/Flow/Id/Security). They are NOT mapped to typed fields;
      # they are preserved in `extra` to avoid data loss on round-trip.
      extra:             { fld: "FLD-ENT-015/016/017/027/036/037/038/039/040", upstream_key: "HeaderType,RequestHost,Path,Extra,Ports,AlterId,Flow,Id,Security", type: "Map (preserved)" }
    obsolete_upstream:
      note: All mapped to `extra`; ProtoExtra/TransportExtra supersede them.
      ids: [FLD-ENT-015, FLD-ENT-016, FLD-ENT-017, FLD-ENT-027, FLD-ENT-036, FLD-ENT-037, FLD-ENT-038, FLD-ENT-039, FLD-ENT-040]

  - rust: domain::SecurityParams
