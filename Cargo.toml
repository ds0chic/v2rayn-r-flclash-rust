[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/application",
    "crates/bridge_api",
    "crates/ipc_contract",
    "crates/config_codegen",
    "crates/runtime",
    "crates/persistence",
    "crates/subscriptions",
    "crates/platform",
    "crates/core_adapters",
    "crates/updater",
    "services/net_host",
    "services/privileged_helper",
    "services/upgrade_runner",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"

[workspace.dependencies]
domain = { path = "crates/domain" }
application = { path = "crates/application" }
ipc_contract = { path = "crates/ipc_contract" }
config_codegen = { path = "crates/config_codegen" }
runtime = { path = "crates/runtime" }
persistence = { path = "crates/persistence" }
subscriptions = { path = "crates/subscriptions" }
platform = { path = "crates/platform" }
core_adapters = { path = "crates/core_adapters" }
updater = { path = "crates/updater" }
flutter_rust_bridge = "=2.13.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
