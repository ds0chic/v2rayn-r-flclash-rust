    - v2rayN/ServiceLib/Manager/AppManager.cs:358
    status: identified
  - id: MIG-ENT-004
    name: MigrateProfileTransportV3ToV4（传输层）
    from_version: 3
    to_version: 4
    identify: 分页 SELECT * FROM ProfileItem WHERE ConfigVersion = 3 LIMIT 100 OFFSET n
    convert: Network==raw 别名改写为 raw；按 GetNetwork() 分支把旧列写 TransportExtra：raw->RawHeaderType/Host/Path；ws/httpupgrade->Host/Path；xhttp->Host/Path/XhttpMode=HeaderType/XhttpExtra=Extra；grpc->GrpcAuthority=RequestHost/GrpcServiceName=Path/GrpcMode=HeaderType；kcp->KcpHeaderType=HeaderType/KcpSeed=Path；default 归一到 DefaultNetwork 并写 RawHeaderType/Host
    write_back: SetTransportExtra；item.ConfigVersion=4；UpdateAllAsync
    symbol: AppManager.MigrateProfileTransportV3ToV4
    idempotency: ConfigVersion=3 过滤；更新后为 4 不再重入
    failure_handling: 单条 catch 记录；更新失败 offset += batch.Count 跳过整批
