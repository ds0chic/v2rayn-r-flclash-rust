# ---------------------------------------------------------------------------
# Reference semantics (compat/fields.yaml reference_semantics REF-ENT-001..006)
# ---------------------------------------------------------------------------
references:
  - rust: domain::ReferenceExpr::remarks
    ledger: REF-ENT-001
    kind: string_remarks
    used_by: "RoutingRule.outbound_tag -> Profile.remarks"
  - rust: domain::ReferenceExpr::remarks
    ledger: REF-ENT-002
    kind: string_remarks
    used_by: "Subscription.prev_profile / next_profile -> Profile.remarks"
  - rust: domain::ReferenceExpr::parse_index_ids
    ledger: REF-ENT-003
    kind: comma_separated_index_ids
    used_by: "ProtocolExtra.child_items -> Profile.index_id"
  - rust: domain::ReferenceExpr::subscription_with_filter
    ledger: REF-ENT-004
    kind: subscription_id_plus_regex
    used_by: "ProtocolExtra.sub_child_items + filter -> Subscription.id + remarks regex"
  - rust: domain::ReferenceExpr (ReferenceSource::Remapped)
    ledger: REF-ENT-005
    kind: id_remap
    used_by: "internal import/export id rewriting"
  - rust: domain::SELF_SENTINEL
    ledger: REF-ENT-006
    kind: sentinel_string
    used_by: "SubChildItems == \"self\" -> owning subscription id"

# ---------------------------------------------------------------------------
# Migration paths (compat/fields.yaml migration_paths MIG-ENT-*)
# ---------------------------------------------------------------------------
migrations:
  - rust: domain::MigrationRecord
    ledger: [MIG-ENT-001, MIG-ENT-002, MIG-ENT-003]
    note: >-
      MigrateProfileExtra V2->V4: GroupV2ToV3 moves ProfileGroupItem into
      ProtocolExtra; ProfileV2ToV3 maps legacy ProfileItem columns
      (AlterId/Flow/Id/Security/Ports) into ProtocolExtra; TransportV3ToV4
      maps HeaderType/RequestHost/Path/Extra into TransportExtra. Legacy
      columns are preserved in `Profile.extra` until T04 migrates them.

coverage:
  profile_item: 40
  protocol_extra_item: 30
  transport_extra_item: 11
  security_params: 13
  subscription: 17
  routing_profile: 13
  routing_rule: 13
  dns_profile: 9
  full_config_template: 8
  traffic_stats: 6
  app_settings_root: 25
  app_settings_items: 180
  references: 6
  enums: 10
